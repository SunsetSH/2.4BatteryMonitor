<style>
    .t { font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
    .fly { animation: fly 10s ease-in-out infinite; }
    @keyframes fly { 0%,22% { opacity:0; transform: translateY(14px); } 28%,86% { opacity:1; transform: translateY(0); } 92%,100% { opacity:0; transform: translateY(14px); } }
    .cur { animation: cur 10s ease-in-out infinite; }
    @keyframes cur { 0% { transform: translate(420px,120px); } 16%,24% { transform: translate(651px,296px); } 40%,86% { transform: translate(700px,170px); } 100% { transform: translate(420px,120px); } }
    .press { animation: press 10s linear infinite; opacity: 0; }
    @keyframes press { 0%,19% { opacity:0; } 21% { opacity:.35; } 25%,100% { opacity:0; } }
    .hover { animation: hover 10s linear infinite; opacity: 0; }
    @keyframes hover { 0%,15% { opacity:0; } 17%,27% { opacity:1; } 30%,100% { opacity:0; } }
    .grow { animation: grow 10s ease-in-out infinite; transform-origin: left center; transform-box: fill-box; }
    @keyframes grow { 0%,28% { transform: scaleX(.93); } 80%,100% { transform: scaleX(1); } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,60%,100% { opacity:1; } 75% { opacity:.45; } }
    </style>
