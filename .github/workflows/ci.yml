# Windows: the full check (build, every test, icon resources). Linux: the GTK build and its tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit  # make calls powershell.exe for build/version.h
          install: >-
            make
            mingw-w64-x86_64-gcc
      - name: make check
        run: make check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 and Cairo
        run: sudo apt-get update && sudo apt-get install -y g++ make libgtk-4-dev libcairo2-dev
      - name: Build
        run: ./build-linux.sh
      - name: Test
        run: ./build-linux.sh test
